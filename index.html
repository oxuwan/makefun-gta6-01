<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Porto Verde — an original open-world crime game: steal cars, outrun the police, and run five story jobs across a sun-soaked procedural city.">
<title>Porto Verde — Open World Crime Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1420; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #f2ede2; font: 18px system-ui, sans-serif; background: #0e1420; z-index: 1; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game" aria-label="Porto Verde: an open-world crime game. Drive, steal cars, outrun the police and finish missions."></canvas>
<div id="loading">Loading Porto Verde… press Enter to start once the city appears.</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
